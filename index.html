/* Atardecer synthwave detrás; delante un monitor CRT en pixel art cuya pantalla es una BIOS azul con el menú. */
:root{
  color-scheme:dark;
  --night:#2b2468;
  --bios:#261a3b;
  --bios-ink:#cfd3f2;
  --bios-dim:#a597bd;
  --yellow:#ffe55c;
  --select:#e8235f;
  --cyan:#2fd8ff;
  --orange:#ff9447;
  --pink:#ff3d8b;
  --mint:#5cffc0;
  --px:"Pixelify Sans",ui-monospace,Menlo,monospace;
  --vt:"VT323",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;overflow:hidden}
body{
  color:var(--bios-ink);font-family:var(--vt);
  background:var(--night);
  display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px dashed var(--yellow);outline-offset:3px}

/* ---------- atardecer por bandas, sol a rayas y suelo de neón ---------- */
.sky{
  position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(120% 60% at 50% 105%,rgba(255,199,95,.55),transparent 60%),
    linear-gradient(to bottom,#2b2468 0%,#3d2a7e 22%,#5f2f8e 42%,#8a2a84 60%,#c9357a 74%,#f05a63 86%,#ff9a52 100%);
}
.stars{position:fixed;left:0;top:0;width:3px;height:3px;z-index:-2;background:transparent;
  box-shadow:
    5vw 6vh #fff,14vw 18vh #cfd3f2,22vw 4vh #ffe55c,31vw 14vh #fff,43vw 8vh #2fd8ff,52vw 3vh #fff,61vw 16vh #cfd3f2,
    70vw 7vh #fff,79vw 20vh #ff9447,88vw 9vh #fff,95vw 15vh #2fd8ff,9vw 30vh #fff,27vw 26vh #cfd3f2,74vw 29vh #fff,90vw 33vh #fff,
    37vw 33vh #ffe55c,57vw 24vh #fff,3vw 40vh #2fd8ff,97vw 42vh #cfd3f2;
  animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.55}}
.scan{position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.16) 2px 3px)}

/* ---------- monitor ---------- */
.pc{width:760px;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;display:flex;flex-direction:column;align-items:center}
.crt{
  --u:5px;--b:7;
  position:relative;width:100%;
  padding:calc(var(--u)*9) calc(var(--u)*22) calc(var(--u)*17) calc(var(--u)*22);
}
.crt canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}

/* ---------- pantalla BIOS ---------- */
.screen{
  position:relative;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;
  padding:14px;
  font-size:21px;line-height:1.15;
  text-shadow:0 0 4px rgba(207,211,242,.35);
}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cyan);color:var(--bios);padding:1px 8px;text-shadow:none}
.lang{display:flex;gap:2px}
.lang button{padding:0 6px}
.lang button[aria-pressed="true"]{background:var(--bios);color:var(--cyan)}
.box{flex:1;border:4px double var(--bios-ink);margin-top:8px;padding:16px 18px 12px}
.label{color:var(--bios-dim)}
.name{font-family:var(--px);font-weight:600;color:var(--yellow);font-size:38px;line-height:1.05;margin-top:2px;white-space:nowrap;
  text-shadow:3px 3px 0 #0e0818}
.role{color:#fff;margin-top:4px;font-size:1.1em}
.role .sep{color:var(--pink)}
.rule{border-top:2px solid var(--bios-dim);margin:12px 0 8px;opacity:.6}

.menu{list-style:none;display:flex;flex-direction:column;gap:1px}
.item{display:grid;grid-template-columns:1.1em minmax(0,1fr) auto;column-gap:6px;align-items:baseline;padding:1px 6px 1px 2px;cursor:pointer;font-size:1.08em}
.item .arrow{visibility:hidden}
.item .what{min-width:0;color:#fff}
.item .where{display:block;font-size:.8em;color:var(--bios-dim)}
.item .state{white-space:nowrap;font-size:.9em}
.item .ok{color:var(--mint)}
.item .soon{color:var(--bios-dim)}
.item .go{color:var(--yellow)}
.item.sub{padding-left:1.5em}
.item.sub .tree{color:var(--yellow);margin-right:.3em}
.item[aria-current="true"]{background:var(--select);text-shadow:none}
.item[aria-current="true"] .arrow{visibility:visible;color:#fff;animation:blink .8s steps(1) infinite}
.item[aria-current="true"] .where,.item[aria-current="true"] .soon{color:#ffd0dc}
.item[aria-current="true"] .ok,.item[aria-current="true"] .tree,.item[aria-current="true"] .go{color:#fff}
.item a{color:inherit;text-decoration:none}
@keyframes blink{50%{opacity:0}}

.loading{display:inline-flex;align-items:center;gap:6px;color:var(--orange)}
.item[aria-current="true"] .loading{color:#fff}
.pbar{position:relative;display:inline-block;width:84px;height:.6em;border:2px solid currentColor;overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;width:30%;background:currentColor;animation:load 1.8s steps(12) infinite}
@keyframes load{0%{left:-30%}100%{left:100%}}

.help{border:4px double var(--bios-ink);border-top:0;padding:6px 18px 8px;min-height:3.6em}
.help .t{color:var(--yellow)}
.help b{font-weight:400;color:#fff}
.keys{margin-top:8px;background:var(--bios-ink);color:var(--bios);padding:1px 8px;text-shadow:none;display:flex;flex-wrap:wrap;gap:4px 18px}
.keys span b{font-weight:400;color:var(--select)}

footer{margin-top:14px;font-size:19px}
footer a{color:#fff;text-shadow:0 0 6px rgba(255,61,139,.8)}

@media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
</head>

let lang = (()=>{ try{ const v=localStorage.getItem('travel-lang'); if(v==='es'||v==='en') return v; }catch(e){}
  return (navigator.language||'es').toLowerCase().startsWith('es')?'es':'en'; })();
let sel = 2;
const menu=document.getElementById('menu'), status=document.getElementById('status');

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t[el.dataset.i]; });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  menu.innerHTML='';
  ITEMS.forEach((it,i)=>{
    const li=document.createElement('li');
    li.className='item'+(it.sub?' sub':'');
    const arrow=document.createElement('span'); arrow.className='arrow'; arrow.textContent='►'; arrow.setAttribute('aria-hidden','true');
    const what=document.createElement(it.href?'a':'span'); what.className='what';
    if(it.href) what.href=it.href;
    if(it.tree){ const tr=document.createElement('span'); tr.className='tree'; tr.textContent=it.tree; tr.setAttribute('aria-hidden','true'); what.append(tr); }
    what.append(document.createTextNode(t[it.id]));
    if(it.where){ const w=document.createElement('span'); w.className='where'; w.textContent=t[it.where]; what.append(w); }
    const st=document.createElement('span'); st.className='state';
    if(it.state==='ok') st.innerHTML='<span class="ok">[ OK ]</span>';
    else if(it.state==='loading') st.innerHTML=`<span class="loading">${t.loading}<span class="pbar" aria-hidden="true"><i></i></span></span>`;
    else if(it.state==='soon') st.innerHTML=`<span class="soon">[ ${t.soon} ]</span>`;
    else if(it.href) st.innerHTML='<span class="go">[ Enter ]</span>';
    li.append(arrow,what,st);
    li.onmouseenter=()=>{ if(sel!==i){ sel=i; update(); } };
    li.onclick=e=>{ sel=i; update(); if(it.href && e.target.closest('a')==null) location.href=it.href; };
    menu.append(li);
  });
  update();
}
function update(){
  [...menu.children].forEach((li,i)=>li.setAttribute('aria-current',String(i===sel)));
  status.innerHTML=T[lang]['st_'+ITEMS[sel].id];
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); sel=(sel+1)%ITEMS.length; update(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sel=(sel-1+ITEMS.length)%ITEMS.length; update(); }
  else if(e.key==='Enter' && !(e.target.closest && e.target.closest('a,button')) && ITEMS[sel].href){ location.href=ITEMS[sel].href; }
});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang; try{ localStorage.setItem('travel-lang',lang); }catch(e){} render();
});
render();

/* ---------- monitor CRT en pixel art ----------
   Se dibuja a baja resolución (1 píxel = 1 celda), se quitan los bordes suaves
   y se amplía sin suavizar: así todas las curvas y diagonales salen escalonadas. */
const PAL={
  out:'#1a1030', bez:'#d9cde6', hi:'#f7f2fc', sh:'#a898bf', back:'#9a89b4', backSh:'#7a6997',
  recess:'#2a1d45', glass:'#261a3b', glassHi:'#4a3a66', mint:'#5cffc0', pink:'#ff3d8b', orange:'#ff9447', yellow:'#ffe55c', cyan:'#2fd8ff'
};
const PAL_RGB=Object.values(PAL).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const crt=document.getElementById('crt'), cv=document.getElementById('draw'), scr=document.getElementById('screen');

function drawCRT(){
  const R={width:crt.offsetWidth,height:crt.offsetHeight,left:0,top:0};
  const Sr={left:scr.offsetLeft,top:scr.offsetTop,right:scr.offsetLeft+scr.offsetWidth,bottom:scr.offsetTop+scr.offsetHeight};
  const cs=getComputedStyle(crt), u=parseFloat(cs.getPropertyValue('--u'))||5;
  const cols=Math.ceil(R.width/u), rows=Math.ceil(R.height/u);
  const off=document.createElement('canvas'); off.width=cols; off.height=rows;
  const g=off.getContext('2d');
  const set=c=>{ g.fillStyle=c; g.strokeStyle=c; };
  const plot=(x,y)=>g.fillRect(Math.round(x),Math.round(y),1,1);
  const line=(x0,y0,x1,y1)=>{ x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    const dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1; let e=dx+dy;
    for(;;){ plot(x0,y0); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } };
  const polyline=pts=>{ for(let i=0;i<pts.length-1;i++) line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]); };
  const fillPoly=pts=>{ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0]+.5,p[1]+.5):g.moveTo(p[0]+.5,p[1]+.5)); g.closePath(); g.fill(); };
  const shape=(x0,y0,x1,y1,r,bulge)=>{
    const pts=[]; const H=Math.PI/2;
    const arc=(cx,cy,a0)=>{ const n=Math.max(4,r*2); for(let i=0;i<=n;i++){ const a=a0+H*i/n; pts.push([Math.round(cx+r*Math.cos(a)),Math.round(cy+r*Math.sin(a))]); } };
    const edge=(ax,ay,bx,by,nx,ny)=>{ const n=Math.max(2,Math.round(Math.hypot(bx-ax,by-ay))); for(let i=0;i<=n;i++){ const t=i/n, b=bulge*4*t*(1-t); pts.push([Math.round(ax+(bx-ax)*t+nx*b),Math.round(ay+(by-ay)*t+ny*b)]); } };
    arc(x0+r,y0+r,2*H); edge(x0+r,y0,x1-r,y0,0,-1);
    arc(x1-r,y0+r,3*H); edge(x1,y0+r,x1,y1-r,1,0);
    arc(x1-r,y1-r,0);   edge(x1-r,y1,x0+r,y1,0,1);
    arc(x0+r,y1-r,H);   edge(x0,y1-r,x0,y0+r,-1,0);
    pts.push(pts[0]); return pts;
  };
  const c=v=>Math.round(v/u);
  const sx0=c(Sr.left-R.left), sy0=c(Sr.top-R.top), sx1=c(Sr.right-R.left)-1, sy1=c(Sr.bottom-R.top)-1;
  const b=parseFloat(cs.getPropertyValue('--b'))||7;
  const B={x0:sx0-b, y0:sy0-b, x1:sx1+b, y1:sy1+b+3};
  const Bw=B.x1-B.x0, Bh=B.y1-B.y0;
  const D=c(parseFloat(cs.paddingRight))-b-3;
  const t=Math.round(Bh*.16);

  /* 1. trasera abultada */
  const back=[[B.x1-3,B.y0+3],[B.x1+D-3,B.y0+t],[B.x1+D-1,B.y0+t+2],[B.x1+D,B.y0+t+5],[B.x1+D,B.y1-t-5],[B.x1+D-1,B.y1-t-2],[B.x1+D-3,B.y1-t],[B.x1-3,B.y1-4]];
  set(PAL.back); fillPoly(back);
  set(PAL.backSh); fillPoly([[B.x1-3,Math.round((B.y0+B.y1)/2)+2],[B.x1+D,Math.round((B.y0+B.y1)/2)+2],[B.x1+D,B.y1-t-5],[B.x1+D-1,B.y1-t-2],[B.x1+D-3,B.y1-t],[B.x1-3,B.y1-4]]);
  set(PAL.out); polyline(back);
  for(let k=0;k<4;k++){ const x=B.x1+3+k*Math.max(2,Math.round(D/5)); if(x<B.x1+D-3){ const m=Math.round((B.y0+B.y1)/2); line(x,m-Math.round(Bh*.16),x,m+Math.round(Bh*.16)); } }

  /* 2. pie */
  const cx=Math.round((B.x0+B.x1)/2), nw=Math.round(Bw*.1), tw=Math.round(Bw*.2), bw=Math.round(Bw*.28);
  const neck=[[cx-nw,B.y1],[cx+nw,B.y1],[cx+nw,B.y1+4],[cx-nw,B.y1+4]];
  set(PAL.sh); fillPoly(neck); set(PAL.out); polyline([...neck,neck[0]]);
  const base=[[cx-tw,B.y1+4],[cx+tw,B.y1+4],[cx+bw,B.y1+8],[cx-bw,B.y1+8]];
  set(PAL.bez); fillPoly(base); set(PAL.sh); line(cx-bw+1,B.y1+7,cx+bw-1,B.y1+7);
  set(PAL.out); polyline([...base,base[0]]);

  /* 3. carcasa frontal con luz arriba-izquierda y sombra abajo-derecha */
  const front=shape(B.x0,B.y0,B.x1,B.y1,6,0);
  set(PAL.bez); fillPoly(front);
  set(PAL.hi); line(B.x0+6,B.y0+1,B.x1-6,B.y0+1); line(B.x0+1,B.y0+6,B.x0+1,B.y1-6);
  set(PAL.sh); line(B.x0+6,B.y1-1,B.x1-6,B.y1-1); line(B.x1-1,B.y0+6,B.x1-1,B.y1-6);
  set(PAL.out); polyline(front);

  /* 4. hueco y cristal abombado */
  set(PAL.recess); fillPoly(shape(sx0-3,sy0-3,sx1+3,sy1+3,5,1));
  const glass=shape(sx0-1,sy0-1,sx1+1,sy1+1,4,2);
  set(PAL.glass); fillPoly(glass);
  set(PAL.out); polyline(glass);
  set(PAL.glassHi); line(sx0+3,sy0-1,sx0+Math.round((sx1-sx0)*.18),sy0-1);

  /* 5. barbilla: rayas de atardecer, rejilla, botón y led */
  const ly=B.y1-5;
  [[PAL.yellow,0],[PAL.orange,1],[PAL.pink,2],[PAL.cyan,3]].forEach(([col,i])=>{ set(col); line(B.x0+6,ly-1+i,B.x0+9,ly-1+i); });
  set(PAL.sh); for(let i=0;i<5;i++) line(cx-8+i*4,ly,cx-6+i*4,ly);
  set(PAL.out); polyline([[B.x1-14,ly-1],[B.x1-10,ly-1],[B.x1-10,ly+1],[B.x1-14,ly+1],[B.x1-14,ly-1]]);
  set(PAL.mint); g.fillRect(B.x1-7,ly,2,1);

  /* quitar suavizado: alfa a 0/255 y cada color al más cercano de la paleta */
  const img=g.getImageData(0,0,cols,rows), d=img.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<110){ d[i+3]=0; continue; }
    let best=0,bd=1e9; for(let k=0;k<PAL_RGB.length;k++){ const p=PAL_RGB[k]; const q=(p[0]-d[i])**2+(p[1]-d[i+1])**2+(p[2]-d[i+2])**2; if(q<bd){bd=q;best=k;} }
    const p=PAL_RGB[best]; d[i]=p[0]; d[i+1]=p[1]; d[i+2]=p[2]; d[i+3]=255;
  }
  g.putImageData(img,0,0);

  const dpr=Math.min((devicePixelRatio||1)*scaleK,4);
  cv.width=Math.round(R.width*dpr); cv.height=Math.round(R.height*dpr);
  const m=cv.getContext('2d'); m.imageSmoothingEnabled=false;
  m.setTransform(dpr,0,0,dpr,0,0); m.clearRect(0,0,R.width,R.height);
  m.drawImage(off,0,0,cols*u,rows*u);
}
/* todo se diseña a 760px de ancho y se escala entero para caber en la ventana, sin cambiar proporciones */
const pc=document.querySelector('.pc');
let scaleK=1;
function fit(){
  pc.style.transform='translate(-50%,-50%)';
  const w=pc.offsetWidth, h=pc.offsetHeight;
  scaleK=Math.min((innerWidth-24)/w,(innerHeight-24)/h,1.6);
  pc.style.transform=`translate(-50%,-50%) scale(${scaleK})`;
  drawCRT();
}
addEventListener('resize',fit);
new ResizeObserver(()=>fit()).observe(scr);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
fit();
})();
</script>
